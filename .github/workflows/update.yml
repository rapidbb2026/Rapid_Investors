name: Update dashboard data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl requests
      - name: Download Kobo export
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_SERVER: https://eu.kobotoolbox.org
          KOBO_ASSET_UID: aHJpsu8ZQtVthnPVppzGnJ
        run: python scripts/fetch_kobo.py export.xlsx
      - name: Build data file
        run: python scripts/build.py export.xlsx scripts/bd_div.json data/data.json
      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
