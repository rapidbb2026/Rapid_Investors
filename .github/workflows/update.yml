name: Update dashboard data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl requests
      - name: Download Kobo export
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_SERVER: https://eu.kobotoolbox.org
          KOBO_ASSET_UID: aHJpsu8ZQtVthnPVppzGnJ
        run: python scripts/fetch_kobo.py export.xlsx
      - name: Build data file
        run: python scripts/build.py export.xlsx scripts/bd_div.json data/data.json
      - name: Commit when the survey data changed
        run: |
          # Compare with the last saved data, ignoring the time stamp, so the repo only grows when there is new data.
          old=$(git show HEAD:data/data.json 2>/dev/null | jq -S 'del(.exported)' || echo none)
          new=$(jq -S 'del(.exported)' data/data.json)
          if [ "$old" = "$new" ] && [ -f data/latest.xlsx ]; then
            echo "No new submissions, nothing to commit."
            exit 0
          fi
          cp export.xlsx data/latest.xlsx          # backup the site offers as "Download latest .xlsx"
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/data.json data/latest.xlsx
          git commit -m "Update data"
          # Someone may have pushed (for example an edited index.html) while this run was working.
          # Put this commit on top of theirs; for the two data files, the fresh copy from this run wins.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying in 10 seconds ($i of 5)"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push after 5 tries."
          exit 1
